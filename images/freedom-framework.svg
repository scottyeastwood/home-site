<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 176 1200 284" width="1200" height="284" role="img" aria-label="The Freedom Framework: Find the 20%, Protect the Calendar, Clear the Block">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Roboto:wght@400&amp;display=swap');
      .lab{font-family:'Montserrat',sans-serif;font-weight:700;font-size:23px;fill:#0C2340;}
      .tag{font-family:'Roboto',-apple-system,Segoe UI,sans-serif;font-weight:400;font-size:15px;fill:#6B7280;letter-spacing:.3px;}
    </style>
  </defs>

  <!-- connectors -->
  <line x1="392" y1="278" x2="508" y2="278" stroke="#CBD5DE" stroke-width="2"/>
  <path d="M500 270 L512 278 L500 286" fill="none" stroke="#04A4E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="692" y1="278" x2="808" y2="278" stroke="#CBD5DE" stroke-width="2"/>
  <path d="M800 270 L812 278 L800 286" fill="none" stroke="#04A4E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- STEP 1: Find the 20% -->
  <circle cx="300" cy="278" r="88" fill="none" stroke="#04A4E9" stroke-width="2" opacity="0.35"/>
  <circle cx="300" cy="278" r="76" fill="#0C2340"/>
  <circle cx="300" cy="278" r="34" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M300 244 A34 34 0 0 1 332.3 267.5" fill="none" stroke="#04A4E9" stroke-width="8" stroke-linecap="round"/>
  <text class="lab" x="300" y="410" text-anchor="middle">Find the 20%</text>
  <text class="tag" x="300" y="438" text-anchor="middle">the work that pays</text>

  <!-- STEP 2: Protect the Calendar -->
  <circle cx="600" cy="278" r="88" fill="none" stroke="#04A4E9" stroke-width="2" opacity="0.35"/>
  <circle cx="600" cy="278" r="76" fill="#0C2340"/>
  <line x1="584" y1="240" x2="584" y2="252" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="616" y1="240" x2="616" y2="252" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <rect x="566" y="248" width="68" height="60" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="566" y1="266" x2="634" y2="266" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="596" y="278" width="20" height="15" rx="3" fill="#04A4E9"/>
  <text class="lab" x="600" y="410" text-anchor="middle">Protect the Calendar</text>
  <text class="tag" x="600" y="438" text-anchor="middle">time you defend</text>

  <!-- STEP 3: Clear the Block -->
  <circle cx="900" cy="278" r="88" fill="none" stroke="#04A4E9" stroke-width="2" opacity="0.35"/>
  <circle cx="900" cy="278" r="76" fill="#0C2340"/>
  <rect x="888" y="223" width="16" height="42" rx="4" fill="#FFFFFF" transform="rotate(-10 896 244)"/>
  <rect x="896" y="291" width="16" height="42" rx="4" fill="#FFFFFF" transform="rotate(10 904 312)"/>
  <path d="M846 278 L950 278" fill="none" stroke="#04A4E9" stroke-width="5" stroke-linecap="round"/>
  <path d="M944 268 L958 278 L944 288" fill="none" stroke="#04A4E9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lab" x="900" y="410" text-anchor="middle">Clear the Block</text>
  <text class="tag" x="900" y="438" text-anchor="middle">move through fear</text>
</svg>
